registry: ghcr.io
namespace: ""

defaults:
  revision: main
  extra_args: []
  variants: [online, offline]
  platforms: [linux/amd64]
  runner: ubuntu-latest
  enabled: true

runtimes:
  vllm:
    image: basal-vllm
    base_image: vllm/vllm-openai:v0.11.0
    port: 8000
  llamacpp:
    image: basal-llamacpp
    base_image: ghcr.io/ggml-org/llama.cpp:server-cuda
    port: 8080

images:
  - name: basal-2.0-mini
    model: Remek/basal-2.0-mini
    runtime: vllm
  - name: basal-2.0-4.5b
    model: Remek/basal-2.0-4.5B
    runtime: vllm
  - name: basal-2.0-max
    model: Remek/basal-2.0-max
    runtime: vllm

  - name: basal-2.0-mini-fp8
    model: Remek/basal-2.0-mini-FP8
    runtime: vllm
  - name: basal-2.0-4.5b-fp8
    model: Remek/basal-2.0-4.5B-FP8
    runtime: vllm
  - name: basal-2.0-max-fp8
    model: Remek/basal-2.0-max-FP8
    runtime: vllm

  - name: basal-2.0-mini-gguf
    model: Remek/basal-2.0-mini-GGUF
    runtime: llamacpp
    gguf_file: basal-2.0-mini-Q5_K_M.gguf
  - name: basal-2.0-4.5b-gguf
    model: Remek/basal-2.0-4.5B-GGUF
    runtime: llamacpp
    gguf_file: basal-2.0-4.5B-Q5_K_M.gguf
  - name: basal-2.0-max-gguf
    model: Remek/basal-2.0-max-GGUF
    runtime: llamacpp
    gguf_file: basal-2.0-max-Q5_K_M.gguf

  - name: basal-omni-1.1-max
    model: Remek/basal-omni-1.1-max
    runtime: vllm
    extra_args: [--trust-remote-code]

  - name: basal-2.0-mini-mlx-8bit
    model: Remek/basal-2.0-mini-MLX-8bit
    runtime: vllm
    enabled: false
  - name: basal-2.0-4.5b-mlx-8bit
    model: Remek/basal-2.0-4.5B-MLX-8bit
    runtime: vllm
    enabled: false
  - name: basal-2.0-max-mlx-8bit
    model: Remek/basal-2.0-max-MLX-8bit
    runtime: vllm
    enabled: false
