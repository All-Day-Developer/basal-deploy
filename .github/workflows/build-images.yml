name: build-images

on:
  push:
    branches: [master]
    paths:
      - images.yaml
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - src/**
      - .github/workflows/build-images.yml
  pull_request:
    paths:
      - images.yaml
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - src/**
      - tests/**
      - .github/workflows/build-images.yml
  workflow_dispatch:
    inputs:
      only:
        description: Comma-separated image names (empty = all enabled)
        required: false
        default: ""
      variant:
        description: Which variants to build
        type: choice
        options: [all, slim, weights]
        default: all
      precompile:
        description: Precompile vLLM graphs on the GPU runner
        type: boolean
        default: true
      push:
        description: Push images to the registry
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  plan:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      registry: ${{ steps.plan.outputs.registry }}
      namespace: ${{ steps.plan.outputs.namespace }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
          enable-cache: true
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
          VARIANT: ${{ github.event_name == 'pull_request' && 'slim' || inputs.variant || 'all' }}
          PRECOMPILE: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.precompile) }}
          OWNER: ${{ github.repository_owner }}
        run: |
          args=(matrix --compact --variant "$VARIANT")
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$PRECOMPILE" != "true" ] && args+=(--no-precompile)
          plan=$(uv run --locked --no-dev basal-images "${args[@]}")
          echo "$plan" | jq .
          namespace=$(echo "$plan" | jq -r '.namespace')
          [ -z "$namespace" ] && namespace="$OWNER"
          {
            echo "matrix=$(echo "$plan" | jq -c '.matrix')"
            echo "registry=$(echo "$plan" | jq -r '.registry')"
            echo "namespace=${namespace,,}"
            echo "count=$(echo "$plan" | jq '.matrix.include | length')"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    name: ${{ matrix.name }} (${{ matrix.variant }}${{ matrix.precompile && ', precompiled' || '' }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PUSH: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
      IMAGE: ${{ needs.plan.outputs.registry }}/${{ needs.plan.outputs.namespace }}/${{ matrix.name }}
      LOCAL_TAG: basal-local/${{ matrix.name }}:${{ matrix.variant }}-${{ github.run_id }}
    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        env:
          VARIANT: ${{ matrix.variant }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          short=${SHA::7}
          if [ "$VARIANT" = "slim" ]; then prefix=""; floating="latest"; else prefix="weights-"; floating="weights"; fi
          if [ "$EVENT" = "pull_request" ]; then
            tags="$IMAGE:${prefix}pr-$PR"
          else
            tags="$IMAGE:${floating},$IMAGE:${prefix}sha-$short"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ${{ needs.plan.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.runtime }}
          platforms: ${{ matrix.platforms }}
          load: ${{ matrix.precompile }}
          push: ${{ !matrix.precompile && env.PUSH == 'true' }}
          tags: ${{ matrix.precompile && env.LOCAL_TAG || steps.tags.outputs.tags }}
          build-args: |
            VLLM_IMAGE=${{ matrix.base_image }}
            LLAMACPP_IMAGE=${{ matrix.base_image }}
            WEIGHTS=${{ matrix.variant }}
            MODEL=${{ matrix.model }}
            REVISION=${{ matrix.revision }}
            GGUF_FILE=${{ matrix.gguf_file }}
            EXTRA_ARGS=${{ matrix.extra_args }}
            PORT=${{ matrix.port }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=${{ matrix.model }} (${{ matrix.runtime }}, ${{ matrix.variant }})
          cache-from: type=gha,scope=builder-${{ matrix.runtime }}
          cache-to: ${{ matrix.variant == 'slim' && format('type=gha,mode=min,scope=builder-{0}', matrix.runtime) || '' }}

      - name: Precompile torch graphs
        if: matrix.precompile
        timeout-minutes: ${{ matrix.precompile_timeout }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          rm -rf compile-cache && mkdir -p compile-cache
          docker run --rm --gpus all --ipc=host \
            -e HF_TOKEN \
            -v basal-hf-cache:/models/cache/hf \
            -v "$PWD/compile-cache:/opt/vllm-cache" \
            --entrypoint /opt/basal/venv/bin/basal-images \
            "$LOCAL_TAG" warmup --timeout $(( ${{ matrix.precompile_timeout }} * 60 ))
          sudo chown -R "$(id -u):$(id -g)" compile-cache
          du -sh compile-cache

      - name: Build precompiled image
        if: matrix.precompile
        uses: docker/build-push-action@v6
        with:
          context: .
          target: vllm-compiled
          platforms: ${{ matrix.platforms }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-contexts: |
            compile-cache=./compile-cache
          build-args: |
            VLLM_IMAGE=${{ matrix.base_image }}
            LLAMACPP_IMAGE=${{ matrix.base_image }}
            WEIGHTS=${{ matrix.variant }}
            MODEL=${{ matrix.model }}
            REVISION=${{ matrix.revision }}
            GGUF_FILE=${{ matrix.gguf_file }}
            EXTRA_ARGS=${{ matrix.extra_args }}
            PORT=${{ matrix.port }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=${{ matrix.model }} (${{ matrix.runtime }}, ${{ matrix.variant }}, precompiled)

      - name: Clean up
        if: always() && runner.environment == 'self-hosted'
        run: |
          docker image rm -f "$LOCAL_TAG" || true
          rm -rf compile-cache
