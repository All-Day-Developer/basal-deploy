name: build-images

on:
  push:
    branches: [master]
    paths:
      - images.yaml
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - src/**
      - .github/workflows/build-images.yml
  pull_request:
    paths:
      - images.yaml
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - src/**
      - tests/**
      - .github/workflows/build-images.yml
  workflow_dispatch:
    inputs:
      only:
        description: Comma-separated image names (empty = all enabled)
        required: false
        default: ""
      variant:
        description: Which model image variants to build
        type: choice
        options: [all, online, offline]
        default: all
      push:
        description: Push images to the registry
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUSH: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.28"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  plan:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      runners: ${{ steps.plan.outputs.runners }}
      images: ${{ steps.plan.outputs.images }}
      registry: ${{ steps.plan.outputs.registry }}
      namespace: ${{ steps.plan.outputs.namespace }}
      image_count: ${{ steps.plan.outputs.image_count }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.28"
          enable-cache: true
      - id: plan
        env:
          ONLY: ${{ inputs.only }}
          VARIANT: ${{ github.event_name == 'pull_request' && 'online' || inputs.variant || 'all' }}
          OWNER: ${{ github.repository_owner }}
        run: |
          args=(matrix --compact --variant "$VARIANT")
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          plan=$(uv run --locked --no-dev basal-images "${args[@]}")
          echo "$plan" | jq .
          namespace=$(echo "$plan" | jq -r '.namespace')
          [ -z "$namespace" ] && namespace="$OWNER"
          {
            echo "runners=$(echo "$plan" | jq -c '.runners')"
            echo "images=$(echo "$plan" | jq -c '.images')"
            echo "registry=$(echo "$plan" | jq -r '.registry')"
            echo "namespace=${namespace,,}"
            echo "image_count=$(echo "$plan" | jq '.images.include | length')"
          } >> "$GITHUB_OUTPUT"

  runner:
    needs: plan
    name: runner ${{ matrix.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.runners) }}
    env:
      IMAGE: ${{ needs.plan.outputs.registry }}/${{ needs.plan.outputs.namespace }}/${{ matrix.name }}
    steps:
      - name: Move Docker to /mnt
        if: runner.environment == 'github-hosted'
        run: |
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - uses: actions/checkout@v5

      - name: Compute tags
        id: tags
        env:
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "tags=$IMAGE:pr-$PR" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:latest,$IMAGE:sha-${SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ${{ needs.plan.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            ENGINE_IMAGE=${{ matrix.base_image }}
            LLAMACPP_IMAGE=${{ matrix.base_image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=basal-serve ${{ matrix.runtime }} runner (bring your own model)
          cache-from: type=gha,scope=runner-${{ matrix.runtime }}
          cache-to: type=gha,mode=max,scope=runner-${{ matrix.runtime }}

  build:
    needs: [plan, runner]
    if: needs.plan.outputs.image_count != '0'
    name: ${{ matrix.name }} (${{ matrix.variants }})
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      IMAGE: ${{ needs.plan.outputs.registry }}/${{ needs.plan.outputs.namespace }}/${{ matrix.name }}
    steps:
      - name: Move Docker to /mnt
        if: runner.environment == 'github-hosted'
        run: |
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - uses: actions/checkout@v5

      - name: Compute tags
        id: tags
        env:
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          short=${SHA::7}
          if [ "$EVENT" = "pull_request" ]; then
            echo "online=$IMAGE:online-pr-$PR" >> "$GITHUB_OUTPUT"
            echo "offline=$IMAGE:offline-pr-$PR" >> "$GITHUB_OUTPUT"
          else
            echo "online=$IMAGE:latest,$IMAGE:online,$IMAGE:online-sha-$short" >> "$GITHUB_OUTPUT"
            echo "offline=$IMAGE:offline,$IMAGE:offline-sha-$short" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ${{ needs.plan.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build online
        if: matrix.online
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.online }}
          build-args: |
            ENGINE_IMAGE=${{ matrix.base_image }}
            LLAMACPP_IMAGE=${{ matrix.base_image }}
            VARIANT=online
            MODEL=${{ matrix.model }}
            MODE=${{ matrix.mode }}
            REVISION=${{ matrix.revision }}
            GGUF_FILE=${{ matrix.gguf_file }}
            CONTEXT=${{ matrix.context }}
            SERVE_ARGS=${{ matrix.serve_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=${{ matrix.model }} (basal-serve --mode ${{ matrix.mode }}, online)
          cache-from: type=gha,scope=runner-${{ matrix.runtime }}

      - name: Build offline
        if: matrix.offline
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.offline }}
          build-args: |
            ENGINE_IMAGE=${{ matrix.base_image }}
            LLAMACPP_IMAGE=${{ matrix.base_image }}
            VARIANT=offline
            MODEL=${{ matrix.model }}
            MODE=${{ matrix.mode }}
            REVISION=${{ matrix.revision }}
            GGUF_FILE=${{ matrix.gguf_file }}
            CONTEXT=${{ matrix.context }}
            SERVE_ARGS=${{ matrix.serve_args }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=${{ matrix.model }} (basal-serve --mode ${{ matrix.mode }}, offline)
          cache-from: type=gha,scope=runner-${{ matrix.runtime }}
